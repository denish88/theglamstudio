services:
  theglam_backend:
    container_name: theglam_backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./env/.env.prod
    environment:
      MEDIA_CACHE_DIR: /var/cache/theglam-media
    ports:
      - "4008:3000"
    volumes:
      - ./public:/app/public:ro
      - theglam_media_cache:/var/cache/theglam-media
    restart: always

volumes:
  theglam_media_cache:
